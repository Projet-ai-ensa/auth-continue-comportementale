name: CI

# When should the robot run?
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Download the project
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install the libraries
        run: python -m pip install -r requirements.txt

      - name: Run the tests
        run: python -m pytest